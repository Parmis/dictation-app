services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dictation
      POSTGRES_USER: dictation
      POSTGRES_PASSWORD: dictation
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictation"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
